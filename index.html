<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mustang Desert Storm</title><style>html,body{margin:0;height:100%;background:#000}</style></head><body>
<title>Mustang Desert Storm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#fff3d6; --panel:#1a0f0aee; --line:#d2691e; --hi:#ffd34d; }
  body.storm { --panel:#0c0620ee; --line:#8b3dff; --hi:#fff23a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; touch-action: manipulation; background: #0d0806; overflow: hidden; color: var(--ink); font-family: 'Barlow Condensed', system-ui, sans-serif; }
  body.storm { background: #07030f; }
  #stage { position: fixed; inset: 0; }
  .pop { position: fixed; z-index: 10; background: var(--panel); border: 3px solid var(--line); border-radius: 14px; padding: 14px; display: none; min-width: 230px; }
  .pop.open { display: block; }
  .pop h3 { margin: 0 0 8px; font-family: 'Luckiest Guy', sans-serif; font-weight: 400; color: var(--hi); letter-spacing: 1px; }
  .pop button { display: block; width: 100%; margin: 6px 0; font: 800 18px 'Barlow Condensed', sans-serif; color: var(--ink); background: #ffffff14; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; text-align: left; }
  .pop button.on { background: var(--line); color: #fff; }
  .pop button small { font-weight: 600; opacity: .75; margin-left: 6px; }
  .pop .row { display: flex; gap: 6px; } .pop .row button { text-align: center; }
  #menu { left: 12px; bottom: 90px; }
  #auto { right: 12px; bottom: 90px; }
  #qa { position: fixed; top: 6px; right: 6px; z-index: 9; background: #000c; border: 1px solid #555; border-radius: 8px; padding: 6px 8px; font-size: 13px; max-width: 300px; }
  #qa summary { cursor: pointer; color: #22e0d0; }
  #qa .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  #qa button { font: 600 12px 'Barlow Condensed', sans-serif; padding: 2px 7px; color: #ddd; background: #222; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
  #qa button.on { background: #c06a34; color: #fff; }
  #qalog { font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; color: #999; max-height: 140px; overflow: auto; }
  dialog { background: var(--panel); color: var(--ink); border: 3px solid var(--hi); border-radius: 14px; padding: 20px; text-align: center; }
  dialog .t { font-family: 'Luckiest Guy', sans-serif; font-size: 28px; color: var(--hi); }
  dialog button { font: 800 18px 'Barlow Condensed', sans-serif; padding: 8px 16px; border-radius: 10px; border: 2px solid var(--line); background: #ffffff14; color: var(--ink); cursor: pointer; }
  dialog button.on { background: var(--line); color: #fff; }

  #qa { display: none; }
</style>
<div id="stage"></div>

<div id="menu" class="pop">
  <h3>GAME MODE</h3>
  <button id="mBase">BASE <small>$1.00 per spin</small></button>
  <button id="mAnte">ANTE <small>$1.50 · more Free Games chance</small></button>
  <button id="mBuyFg">BUY FREE GAMES <small>$80 · 10 free games</small></button>
  <button id="mBuy">BUY HOLD &amp; SPIN <small>$100 · guaranteed Hold &amp; Spin</small></button>
  <h3 style="margin-top:12px">OPTIONS</h3>
  <button id="turboBtn">TURBO <small>off</small></button>
  <button id="musicBtn">MUSIC <small>on</small></button>
  <button id="sfxBtn">SOUNDS <small>on</small></button>
  <button id="menuClose">CLOSE</button>
</div>
<div id="soundHint" style="position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:8;pointer-events:none;
  font:800 14px 'Barlow Condensed',sans-serif;letter-spacing:1px;color:#fff;background:#000a;border:1px solid #fff5;border-radius:999px;padding:4px 12px">TAP TO ENABLE SOUND</div>

<div id="auto" class="pop">
  <h3>AUTOPLAY</h3>
  <div class="row"><button data-n="10">10</button><button data-n="25">25</button><button data-n="50">50</button><button data-n="100">100</button></div>
  <div style="font-size:14px;opacity:.75">Stops on any feature, or tap SPIN / AUTO.</div>
</div>

<details id="qa"><summary>QA</summary>
  <div>Force next spin:</div>
  <div class="row" id="forceRow">
    <button data-f="">None</button><button data-f="hs">Hold &amp; Spin</button><button data-f="fg">Free Games</button>
    <button data-f="jackpot">Jackpot</button><button data-f="grand">Grand</button><button data-f="sandstorm">Sandstorm</button><button data-f="buy">Buy H&amp;S (no confirm)</button><button data-f="buyfg">Buy FG (no confirm)</button>
  </div>
  <div class="row"><label><input type="checkbox" id="localOnly" /> local pool only</label></div>
  <div id="qalog"></div>
</details>

<dialog id="buyDlg">
  <form method="dialog"><div class="t" id="buyTitle">BUY BONUS</div>
  <p id="buyText">Buy a guaranteed Mustang Storm Hold &amp; Spin for <b>$100</b>?</p>
  <button value="no">Cancel</button> <button value="yes" class="on" id="buyOk">Buy $100</button></form>
</dialog>
